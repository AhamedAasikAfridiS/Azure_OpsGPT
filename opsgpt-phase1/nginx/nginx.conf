events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream frontend_service {
        server frontend-service:3000;
    }

    upstream core_api_service {
        server core-api-service:8001;
    }

    upstream alert_ingestion_service {
        server alert-ingestion-service:8002;
    }

    upstream ai_analysis_service {
        server ai-analysis-service:8003;
    }

    upstream notification_service {
        server notification-service:8004;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 20m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = /api/core {
            return 301 /api/core/;
        }

        location /api/core/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key, Accept, Origin" always;
                add_header Access-Control-Max-Age 86400 always;
                return 204;
            }

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key, Accept, Origin" always;
            add_header Access-Control-Max-Age 86400 always;
            proxy_pass http://core_api_service/;
        }

        location = /api/alerts {
            return 301 /api/alerts/;
        }

        location /api/alerts/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key, Accept, Origin" always;
                add_header Access-Control-Max-Age 86400 always;
                return 204;
            }

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key, Accept, Origin" always;
            add_header Access-Control-Max-Age 86400 always;
            proxy_pass http://alert_ingestion_service/;
        }

        location = /api/analysis {
            return 301 /api/analysis/;
        }

        location /api/analysis/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key, Accept, Origin" always;
                add_header Access-Control-Max-Age 86400 always;
                return 204;
            }

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key, Accept, Origin" always;
            add_header Access-Control-Max-Age 86400 always;
            proxy_pass http://ai_analysis_service/;
        }

        location = /api/notifications {
            return 301 /api/notifications/;
        }

        location /api/notifications/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key, Accept, Origin" always;
                add_header Access-Control-Max-Age 86400 always;
                return 204;
            }

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key, Accept, Origin" always;
            add_header Access-Control-Max-Age 86400 always;
            proxy_pass http://notification_service/;
        }

        location /alerts/webhook/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key, Accept, Origin" always;
                add_header Access-Control-Max-Age 86400 always;
                return 204;
            }

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key, Accept, Origin" always;
            add_header Access-Control-Max-Age 86400 always;
            proxy_pass http://alert_ingestion_service/alerts/webhook/;
        }

        location / {
            proxy_pass http://frontend_service;
        }
    }
}
