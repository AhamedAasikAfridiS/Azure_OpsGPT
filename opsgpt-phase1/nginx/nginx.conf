server {
    listen 80;
    server_name _;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key" always;
    add_header Access-Control-Max-Age "3600" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/core/ {
        proxy_pass http://core-api-service:8001/;
    }

    location /api/alerts/ {
        proxy_pass http://alert-ingestion-service:8002/;
    }

    location /api/analysis/ {
        proxy_pass http://ai-analysis-service:8003/;
    }

    location /api/notifications/ {
        proxy_pass http://notification-service:8004/;
    }

    location /alerts/webhook/ {
        proxy_pass http://alert-ingestion-service:8002/alerts/webhook/;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://frontend-service:3000;
    }
}
