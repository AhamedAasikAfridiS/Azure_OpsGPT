worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    server {
        listen 8080;
        server_name _;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key" always;
        add_header Access-Control-Max-Age "3600" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx-reverse-proxy"}';
        }

        location = /ready {
            default_type application/json;
            return 200 '{"status":"ready","service":"nginx-reverse-proxy","checks":{"routing":"ok"}}';
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/core/ {
            proxy_pass http://core-api-service:8001/;
        }

        location /api/alerts/ {
            proxy_pass http://alert-ingestion-service:8002/;
        }

        location /api/analysis/ {
            proxy_pass http://ai-analysis-service:8003/;
        }

        location /api/notifications/ {
            proxy_pass http://notification-service:8004/;
        }

        location /alerts/webhook/ {
            proxy_pass http://alert-ingestion-service:8002/alerts/webhook/;
        }

        location / {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://frontend-service:3000;
        }
    }
}
