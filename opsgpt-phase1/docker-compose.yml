services:
  nginx:
    image: nginx:1.27-alpine
    container_name: opsgpt-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-service
      - core-api-service
      - alert-ingestion-service
      - ai-analysis-service
      - notification-service
    networks:
      - opsgpt-network

  frontend-service:
    build:
      context: ./frontend-service
    container_name: opsgpt-frontend-service
    environment:
      VITE_CORE_API_URL: ${VITE_CORE_API_URL:-/api/core}
    ports:
      - "3000:3000"
    depends_on:
      - core-api-service
    networks:
      - opsgpt-network

  core-api-service:
    build:
      context: ./core-api-service
    container_name: opsgpt-core-api-service
    environment:
      DATABASE_URL: postgresql://opsgpt_core:opsgpt_core_password@core-db:5432/opsgpt_core_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-key}
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      ENABLE_NOTIFICATIONS: ${ENABLE_NOTIFICATIONS:-false}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8001:8001"
    depends_on:
      - core-db
    networks:
      - opsgpt-network

  alert-ingestion-service:
    build:
      context: ./alert-ingestion-service
    container_name: opsgpt-alert-ingestion-service
    environment:
      DATABASE_URL: postgresql://opsgpt_alerts:opsgpt_alerts_password@alert-db:5432/opsgpt_alerts_db
      AI_ANALYSIS_SERVICE_URL: http://ai-analysis-service:8003
      ENABLE_ANALYSIS_FORWARDING: ${ENABLE_ANALYSIS_FORWARDING:-false}
      CORE_API_URL: http://core-api-service:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-key}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8002:8002"
    depends_on:
      - alert-db
      - ai-analysis-service
    networks:
      - opsgpt-network

  ai-analysis-service:
    build:
      context: ./ai-analysis-service
    container_name: opsgpt-ai-analysis-service
    environment:
      DATABASE_URL: postgresql://opsgpt_analysis:opsgpt_analysis_password@analysis-db:5432/opsgpt_analysis_db
      CORE_API_URL: http://core-api-service:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-key}
      CORRELATION_WINDOW_MINUTES: ${CORRELATION_WINDOW_MINUTES:-10}
      AI_PROVIDER: ${AI_PROVIDER:-foundry}
      FOUNDRY_ENDPOINT: ${FOUNDRY_ENDPOINT:-}
      FOUNDRY_API_KEY: ${FOUNDRY_API_KEY:-}
      FOUNDRY_MODEL_DEPLOYMENT: ${FOUNDRY_MODEL_DEPLOYMENT:-}
      FOUNDRY_API_VERSION: ${FOUNDRY_API_VERSION:-2024-02-15-preview}
      FOUNDRY_TIMEOUT_SECONDS: ${FOUNDRY_TIMEOUT_SECONDS:-60}
      FOUNDRY_MAX_RETRIES: ${FOUNDRY_MAX_RETRIES:-2}
      FOUNDRY_CHAT_COMPLETIONS_PATH: "/openai/deployments/{deployment}/chat/completions?api-version={api_version}"
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8003:8003"
    depends_on:
      - analysis-db
      - core-api-service
    networks:
      - opsgpt-network

  notification-service:
    build:
      context: ./notification-service
    container_name: opsgpt-notification-service
    environment:
      DATABASE_URL: postgresql://opsgpt_notifications:opsgpt_notifications_password@notification-db:5432/opsgpt_notifications_db
      NOTIFICATION_CHANNEL: ${NOTIFICATION_CHANNEL:-console}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      NOTIFICATION_RETRY_COUNT: ${NOTIFICATION_RETRY_COUNT:-3}
      NOTIFICATION_TIMEOUT_SECONDS: ${NOTIFICATION_TIMEOUT_SECONDS:-10}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8004:8004"
    depends_on:
      - notification-db
    networks:
      - opsgpt-network

  core-db:
    image: postgres:16-alpine
    container_name: opsgpt-core-db
    environment:
      POSTGRES_DB: opsgpt_core_db
      POSTGRES_USER: opsgpt_core
      POSTGRES_PASSWORD: opsgpt_core_password
    volumes:
      - core_db_data:/var/lib/postgresql/data
    networks:
      - opsgpt-network

  alert-db:
    image: postgres:16-alpine
    container_name: opsgpt-alert-db
    environment:
      POSTGRES_DB: opsgpt_alerts_db
      POSTGRES_USER: opsgpt_alerts
      POSTGRES_PASSWORD: opsgpt_alerts_password
    volumes:
      - alert_db_data:/var/lib/postgresql/data
    networks:
      - opsgpt-network

  analysis-db:
    image: postgres:16-alpine
    container_name: opsgpt-analysis-db
    environment:
      POSTGRES_DB: opsgpt_analysis_db
      POSTGRES_USER: opsgpt_analysis
      POSTGRES_PASSWORD: opsgpt_analysis_password
    volumes:
      - analysis_db_data:/var/lib/postgresql/data
    networks:
      - opsgpt-network

  notification-db:
    image: postgres:16-alpine
    container_name: opsgpt-notification-db
    environment:
      POSTGRES_DB: opsgpt_notifications_db
      POSTGRES_USER: opsgpt_notifications
      POSTGRES_PASSWORD: opsgpt_notifications_password
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    networks:
      - opsgpt-network

volumes:
  core_db_data:
  alert_db_data:
  analysis_db_data:
  notification_db_data:

networks:
  opsgpt-network:
    driver: bridge
