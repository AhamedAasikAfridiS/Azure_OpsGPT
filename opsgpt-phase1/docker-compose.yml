services:
  opsgpt-db:
    image: postgres:15
    environment:
      POSTGRES_DB: opsgpt_db
      POSTGRES_USER: opsgpt_user
      POSTGRES_PASSWORD: opsgpt_password
    volumes:
      - opsgpt_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsgpt_user -d opsgpt_db"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - opsgpt-network

  core-api-service:
    build:
      context: ./core-api-service
    environment:
      DATABASE_URL: postgresql://opsgpt_user:opsgpt_password@opsgpt-db:5432/opsgpt_db
      AUTH_PROVIDER: ${AUTH_PROVIDER:-entra}
      ALLOW_LOCAL_AUTH: ${ALLOW_LOCAL_AUTH:-false}
      JWT_SECRET_KEY: change-me
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE}
      AZURE_ISSUER: ${AZURE_ISSUER}
      AZURE_JWKS_URL: ${AZURE_JWKS_URL}
      ENTRA_ROLE_ADMIN: ${ENTRA_ROLE_ADMIN:-OpsGPT.Admin}
      ENTRA_ROLE_SENIOR: ${ENTRA_ROLE_SENIOR:-OpsGPT.Senior}
      ENTRA_ROLE_JUNIOR: ${ENTRA_ROLE_JUNIOR:-OpsGPT.Junior}
      INTERNAL_API_KEY: change-me-internal-key
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      ENABLE_NOTIFICATIONS: "true"
      APP_ENV: development
      CORS_ORIGINS: "*"
    depends_on:
      opsgpt-db:
        condition: service_healthy
      notification-service:
        condition: service_started
    ports:
      - "8001:8001"
    networks:
      - opsgpt-network

  alert-ingestion-service:
    build:
      context: ./alert-ingestion-service
    environment:
      DATABASE_URL: postgresql://opsgpt_user:opsgpt_password@opsgpt-db:5432/opsgpt_db
      AI_ANALYSIS_SERVICE_URL: http://ai-analysis-service:8003
      CORE_API_URL: http://core-api-service:8001
      INTERNAL_API_KEY: change-me-internal-key
      ENABLE_ANALYSIS_FORWARDING: "true"
      APP_ENV: development
      CORS_ORIGINS: "*"
    depends_on:
      opsgpt-db:
        condition: service_healthy
      core-api-service:
        condition: service_started
      ai-analysis-service:
        condition: service_started
    ports:
      - "8002:8002"
    networks:
      - opsgpt-network

  ai-analysis-service:
    build:
      context: ./ai-analysis-service
    environment:
      DATABASE_URL: postgresql://opsgpt_user:opsgpt_password@opsgpt-db:5432/opsgpt_db
      CORE_API_URL: http://core-api-service:8001
      INTERNAL_API_KEY: change-me-internal-key
      CORRELATION_WINDOW_MINUTES: 10
      AI_PROVIDER: azure_foundry
      AZURE_FOUNDRY_API_MODE: responses
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT}
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY}
      AZURE_FOUNDRY_MODEL: ${AZURE_FOUNDRY_MODEL}
      AZURE_FOUNDRY_API_VERSION: ${AZURE_FOUNDRY_API_VERSION:-2025-04-01-preview}
      AZURE_FOUNDRY_TIMEOUT_SECONDS: 60
      AZURE_FOUNDRY_MAX_RETRIES: 2
      AZURE_FOUNDRY_TEMPERATURE: 0.2
      APP_ENV: development
      CORS_ORIGINS: "*"
    depends_on:
      opsgpt-db:
        condition: service_healthy
      core-api-service:
        condition: service_started
    ports:
      - "8003:8003"
    networks:
      - opsgpt-network

  notification-service:
    build:
      context: ./notification-service
    environment:
      DATABASE_URL: postgresql://opsgpt_user:opsgpt_password@opsgpt-db:5432/opsgpt_db
      NOTIFICATION_CHANNEL: console
      SLACK_WEBHOOK_URL: ""
      NOTIFICATION_RETRY_COUNT: 3
      NOTIFICATION_TIMEOUT_SECONDS: 10
      APP_ENV: development
      CORS_ORIGINS: "*"
    depends_on:
      opsgpt-db:
        condition: service_healthy
    ports:
      - "8004:8004"
    networks:
      - opsgpt-network

  frontend-service:
    build:
      context: ./frontend-service
      args:
        VITE_CORE_API_URL: ${VITE_CORE_API_URL:-/api/core}
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-entra}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
        VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI:-http://localhost:8080}
        VITE_AZURE_POST_LOGOUT_REDIRECT_URI: ${VITE_AZURE_POST_LOGOUT_REDIRECT_URI:-http://localhost:8080}
        VITE_AZURE_API_SCOPE: ${VITE_AZURE_API_SCOPE}
    environment:
      VITE_CORE_API_URL: ${VITE_CORE_API_URL:-/api/core}
    depends_on:
      - core-api-service
    ports:
      - "3000:3000"
    networks:
      - opsgpt-network

  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:8080"
    depends_on:
      - frontend-service
      - core-api-service
      - alert-ingestion-service
      - ai-analysis-service
      - notification-service
    networks:
      - opsgpt-network

networks:
  opsgpt-network:
    driver: bridge

volumes:
  opsgpt_db_data:
